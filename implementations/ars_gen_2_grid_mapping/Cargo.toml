[package]
name = "ars_spatial_grid"
version = "0.4.0"
edition = "2021"

[lib]
name = "ars_spatial_grid"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
pyo3 = { version = "0.23.0", features = ["extension-module", "abi3-py310"] }
rayon = "1.10"
ars_native = { path = "../ars_gen_3_apex_baseline" }
hashbrown = { version = "0.14", features = ["ahash"] }
ahash = "0.8"
