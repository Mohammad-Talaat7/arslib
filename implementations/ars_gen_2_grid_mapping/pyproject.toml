[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ars_spatial_grid"
version = "0.4.0"
description = "Adaptive Range Sorting (ARS): Spatial Grid Implementation (Generation 3)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "ars_spatial_grid._arslib"
python-source = "."
