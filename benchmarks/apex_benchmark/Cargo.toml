[package]
name = "ars_apex_vs_others"
version = "1.0.0"
edition = "2021"

[dependencies]
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
sys-info = "0.9"

# Target ARS Algorithm
ars_optimized_apex = { path = "../../implementations/ars_gen_5_optimized_apex" }
ars_gen_6_aero = { path = "../../implementations/ars_gen_6_aero" }
ars_native = { path = "../../implementations/ars_gen_3_apex_baseline" }

# Comparison Algorithms
introsort = "0.6"
sorting_rs = "1.2"
voracious_radix_sort = { version = "1.2", features = ["voracious_multithread"] }
glidesort = "0.1"
pdqsort = "1.0"
rdst = "0.20"
radsort = "0.1"
afsort = "0.2"
universal_radix_sort = "1.0"
wgpu-algorithms = "0.1"
wgpu = "22.1"
bytemuck = { version = "1.16", features = ["derive"] }

# Infrastructure
hashbrown = "0.14"
ahash = "0.8"
rust_xlsxwriter = "0.94"
perf-event = "0.4"
indicatif = "0.17"
libc = "0.2"
pollster = "0.3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "research_engine"
path = "src/main.rs"
