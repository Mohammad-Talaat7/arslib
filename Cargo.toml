[workspace]
resolver = "2"
members = [
    ".",
    "implementations/ars_gen_1_foundation",
    "implementations/ars_gen_2_grid_mapping",
    "implementations/ars_gen_3_apex_baseline",
    "implementations/ars_gen_4_parallel_apex",
    "implementations/ars_gen_5_optimized_apex",
    "implementations/ars_gen_6_aero",
    "implementations/ars_exp_a_recursive_parallel",
    "implementations/ars_exp_b_hierarchical_staging",
    "implementations/ars_exp_c_adaptive_hierarchical",
    "implementations/ars_exp_d_stream_microbatch",
    "benchmarks/apex_benchmark",
    "benchmarks/master_benchmark",
    "benchmarks/scalability_benchmark",
    "benchmarks/streaming_benchmark", "benchmarks/cross_language_suite/dataset_generator", "benchmarks/cross_language_suite/ars_harness",
]

[package]
name = "arslib"
version = "0.4.0"
edition = "2021"
description = "Adaptive Range Sorting (ARS): a fast run-based sorting algorithm in Rust."
readme = "README.md"
authors = ["Mohammad T. Ismael"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mohammad-Talaat7/arslib"
homepage = "https://github.com/Mohammad-Talaat7/arslib"
documentation = "https://docs.rs/arslib"
keywords = ["sorting", "algorithm", "performance", "parallel", "radix"]
categories = ["algorithms", "science", "data-structures"]

[dependencies]
rayon = "1.10"
num-traits = "0.2"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"

[lib]
name = "arslib"
path = "src/lib.rs"
